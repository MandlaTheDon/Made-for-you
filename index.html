<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Special Surprise ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom right, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    color: white;
    overflow: hidden;
}

.container {
    position: relative;
}

/* Password Box */
.box {
    background: rgba(255,255,255,0.2);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

input {
    padding: 10px;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 1em;
    text-align: center;
}

button {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #ff4b5c;
    color: white;
    font-size: 1em;
    cursor: pointer;
}

.error {
    margin-top: 10px;
    display: none;
}

/* Envelope Animation */
.envelope {
    width: 220px;
    height: 150px;
    background: #ff4b5c;
    position: relative;
    margin: auto;
    display: none;
    border-radius: 6px;
}

.flap {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 110px solid transparent;
    border-right: 110px solid transparent;
    border-bottom: 75px solid #ff6b7a;
    top: -75px;
    left: 0;
    transform-origin: bottom;
    transition: transform 1s ease;
}

.letter {
    position: absolute;
    width: 200px;
    height: 120px;
    background: white;
    color: #ff4b5c;
    left: 10px;
    top: 15px;
    border-radius: 5px;
    padding: 10px;
    box-sizing: border-box;
    transform: translateY(0);
    transition: transform 1s ease;
    font-size: 0.9em;
}

/* Open state */
.open .flap {
    transform: rotateX(180deg);
}

.open .letter {
    transform: translateY(-120px);
}
</style>
</head>
<body>

<div class="container">

    <!-- Password Section -->
    <div class="box" id="passwordBox">
        <h2>A special surprise for Snothando ❤️</h2>
        <p>Enter your secret password</p>

        <input type="password" id="password" placeholder="Enter password">
        <br>
        <button onclick="checkPassword()">Open My Surprise</button>

        <div class="error" id="error">Wrong password, try again ❤️</div>
    </div>

    <!-- Envelope -->
    <div class="envelope" id="envelope">
        <div class="flap"></div>
        <div class="letter">
            To my love,<br>
            Open this to see how much you mean to me ❤️
        </div>
    </div>

</div>

<script>
function checkPassword() {
    var password = document.getElementById("password").value;

    if(password === "Wings") {
        // Hide password box
        document.getElementById("passwordBox").style.display = "none";

        // Show envelope
        var env = document.getElementById("envelope");
        env.style.display = "block";

        // Animate opening
        setTimeout(function(){
            env.classList.add("open");
        }, 300);

        // Redirect after animation
        setTimeout(function(){
            window.location.href = "surprise.html";
        }, 2500);

    } else {
        document.getElementById("error").style.display = "block";
    }
}

</script>
</body>
</html>
